# GRUB configuration for Custom Ubuntu OS Live ISO
# إعدادات GRUB لـ ISO التشغيل المباشر

set timeout=10
set default=0
set gfxmode=1024x768,800x600,640x480
set gfxpayload=keep

insmod gfxterm
insmod png

# Set background
if [ -f /boot/grub/background.png ]; then
    background_image /boot/grub/background.png
fi

menuentry "Custom Ubuntu OS (Live)" {
    linux   /casper/vmlinuz boot=casper quiet splash nosplash
    initrd  /casper/initrd.img
}

menuentry "Custom Ubuntu OS (Install)" {
    linux   /casper/vmlinuz boot=casper only-ubiquity quiet splash nosplash
    initrd  /casper/initrd.img
}

menuentry "Boot from Hard Disk" {
    insmod chain
    insmod part_gpt
    set root='(hd0,gpt1)'
    chainloader +1
}

menuentry "System Shutdown" {
    halt
}

menuentry "System Reboot" {
    reboot
}
