# GRUB Configuration for Custom Ubuntu OS Live ISO
# إعدادات GRUB لـ ISO التشغيل المباشر

set timeout=10
set default=0
set gfxmode=1024x768,800x600,640x480
set gfxpayload=keep

insmod gfxterm
insmod png
insmod part_gpt
insmod part_msdos

# Menu entries
menuentry "Custom Ubuntu OS (Live)" {
    linux   /casper/vmlinuz boot=casper quiet splash nosplash
    initrd  /casper/initrd.img
}

menuentry "Custom Ubuntu OS (Live - Safe Mode)" {
    linux   /casper/vmlinuz boot=casper quiet splash nosplash nomodeset
    initrd  /casper/initrd.img
}

menuentry "Custom Ubuntu OS (Install)" {
    linux   /casper/vmlinuz boot=casper only-ubiquity quiet splash nosplash
    initrd  /casper/initrd.img
}

menuentry "Check Disc for Defects" {
    linux   /casper/vmlinuz boot=casper integrity-check quiet splash nosplash
    initrd  /casper/initrd.img
}

menuentry "Boot from Hard Drive" {
    insmod chain
    insmod part_gpt
    set root='(hd0,gpt1)'
    chainloader +1
}

menuentry "UEFI Firmware Settings" {
    fwsetup
}

menuentry "System Shutdown" {
    halt
}

menuentry "System Reboot" {
    reboot
}
