# ISOLINUX configuration for legacy BIOS boot
# إعدادات ISOLINUX للأنظمة القديمة

DEFAULT vesamenu.c32
TIMEOUT 100
PROMPT 0

MENU TITLE Custom Ubuntu OS
MENU COLOR border 30;44 #40ffffff #a0000000 std
MENU COLOR title 1;36;44 #ffffffff #a0000000 std
MENU COLOR sel 7;37;40 #e0ffffff #20ffffff all

LABEL live
    MENU LABEL Custom Ubuntu OS (Live)
    MENU DEFAULT
    KERNEL /casper/vmlinuz
    APPEND boot=casper quiet splash nosplash initrd=/casper/initrd.img

LABEL install
    MENU LABEL Custom Ubuntu OS (Install)
    KERNEL /casper/vmlinuz
    APPEND boot=casper only-ubiquity quiet splash nosplash initrd=/casper/initrd.img

LABEL check
    MENU LABEL Check Disc Integrity
    KERNEL /casper/vmlinuz
    APPEND boot=casper integrity-check quiet splash nosplash initrd=/casper/initrd.img

LABEL memtest
    MENU LABEL Memory Test
    KERNEL /memtest

LABEL hd
    MENU LABEL Boot from Hard Disk
    localboot 0x80

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power Off
    COM32 poweroff.c32
